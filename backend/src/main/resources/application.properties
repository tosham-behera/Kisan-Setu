# ---------- Server ----------
server.port=8080

# ---------- MySQL datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/kisan_setu?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" = Hibernate creates the table from the entity if it is missing,
# and adds new columns if the entity changes. It never drops data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
